# feat/77 human-managed agent stack. `docker compose up -d`, then
#   docker compose exec codeinspect bash
# launch one of: claude · cursor-agent · agy — to inspect, implement a
# spec, or run a review. No brainlab process; the human drives it.
#
# Single container: the three CLIs each spawn the Lua MCP↔LSP bridge
# (mcp-language-server -> lua-language-server) locally over stdio — no
# sidecar, no network. See src/agent/mcp.json.
#
# uid/gid: defaults to 1000. On a non-1000 host, build with matching ids:
#   HOST_UID=$(id -u) HOST_GID=$(id -g) docker compose build
# (HOST_ prefix on purpose: bash's $UID/$EUID are readonly, so an inline
#  `UID=... docker compose build` aborts with "readonly variable".)
# API keys come from the host env (claude: ANTHROPIC_API_KEY,
# cursor: CURSOR_API_KEY; agy authenticates interactively on first run).

name: compy

services:
  agent:
    build:
      context: ./src/agent
      args:
        UID: "${HOST_UID:-1000}"
        GID: "${HOST_GID:-1000}"
    image: compy-dev-agent
    tty: true          # keep the bash session alive for `compose exec`
    stdin_open: true
    command: /bin/bash
    working_dir: /repo
    #environment:
    #  # injected from host; never baked into the image
    #  ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
    #  CURSOR_API_KEY: "${CURSOR_API_KEY:-}"
    tmpfs:
      - /tmp
    volumes:
      - compy-agent-home:/home/agent
      - lua-lsp-cache:/opt/lua-language-server/log/cache
      - ../../../../../../:/repo:rw
      - ../:/impl:rw
      - ../../../../../../../brainlab/sessions/git/doc/development/wip/77-new-input-api/SWEEP:/impl/sessions:rw
      - ../../../../../../../brainlab/sessions/git/doc/development/wip/77-new-input-api/SWEEP:/repo/doc/development/wip/77-new-input-api/implementation/sessions:rw

volumes:
  compy-agent-home:
  lua-lsp-cache:
