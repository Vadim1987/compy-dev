# feat/77 human-managed agent stack. `docker compose up -d`, then
#   docker compose exec codeinspect bash
# launch one of: claude · cursor-agent · agy — to inspect, implement a
# spec, or run a review. No brainlab process; the human drives it.
#
# uid/gid: defaults to 1000. On a non-1000 host, build with matching ids:
#   UID=$(id -u) GID=$(id -g) docker compose build
# API keys come from the host env (claude: ANTHROPIC_API_KEY,
# cursor: CURSOR_API_KEY; agy authenticates interactively on first run).

name: compy-feat77-agents

services:
  # ── MCP-LSP bridge for Lua ────────────────────────────────────────
  # Gives the CLIs structural navigation (defs/refs/diagnostics) over an
  # AST instead of re-reading files — cuts token churn.
  # ⚠ base image internals UNVERIFIED — see src/mcp/Dockerfile. The agent
  #   container works without it (the MCP server just won't connect), so
  #   `docker compose build codeinspect` is independently checkable.
  lsp-mcp:
    build:
      context: ./src/mcp
    image: compy-lsp-mcp:lua
    container_name: lsp-mcp
    volumes:
      # read-only: the LSP only needs to read the codebase to build the AST
      - ../../../../../../:/repo:ro
    networks:
      - mcp-internal-net

  # ── agent container (the three CLIs live here) ────────────────────
  codeinspect:
    build:
      context: ./src/agent
      args:
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
    image: compy-dev-agent
    container_name: codeinspect
    tty: true          # keep the bash session alive for `compose exec`
    stdin_open: true
    command: /bin/bash
    working_dir: /repo
    environment:
      # injected from host; never baked into the image
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      CURSOR_API_KEY: "${CURSOR_API_KEY:-}"
    volumes:
      # read/write + commit: develop and review need to edit the tree
      - ../../../../../../:/repo:rw
      # per-CLI config/state/auth — named volumes so image seeds land on
      # first `up` and self-edits persist (a bind mount would not seed)
      - claude-config:/home/claude/.claude
      - cursor-config:/home/claude/.cursor
      - agy-config:/home/claude/.gemini
    networks:
      - mcp-internal-net

networks:
  # dedicated internal bridge; nothing exposed to the host
  mcp-internal-net:
    driver: bridge

volumes:
  claude-config:
  cursor-config:
  agy-config:
